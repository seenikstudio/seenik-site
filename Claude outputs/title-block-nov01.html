<script src="space-img/mirror-title-enig.js"></script>
<script>
/* Nov 1 SOUND (desktop only): THE MIRROR title — the Enigmatic Intro Transition starts the moment the title starts coming toward you,
   swells as it grows and settles after it lands; a soft glow and star sparkle swell with it, burst outward on landing, then settle away. */
(function () {
  if (innerWidth <= 760) return;
  let buf = null, src = null, t3 = null, landT = null, moving = 0, cv = null, X = null, P = [], burst = 0, last = performance.now() / 1000;
  addEventListener('sn-title3d', () => {   /* the title has just started */
    const A = window.__snSfx, ctx = A && A.ctx(); landT = null; moving = 1; burst = 0;   /* it is on its way */
    if (!ctx || ctx.state !== 'running' || !window.SN_MENIG) return;
    const go = b => { if (src) { try { src.stop(); } catch (e) {} } src = ctx.createBufferSource(); const g = ctx.createGain(); g.gain.value = .8; src.buffer = b; src.connect(g); g.connect(A.out()); src.start(ctx.currentTime + .01); };
    if (buf) go(buf); else { const raw = atob(SN_MENIG), u = new Uint8Array(raw.length); for (let i = 0; i < raw.length; i++) u[i] = raw.charCodeAt(i); ctx.decodeAudioData(u.buffer, b => { buf = b; go(b); }, () => {}); }
  });
  (function f() { requestAnimationFrame(f);
    const tn = performance.now() / 1000, dt = Math.min(.1, tn - last); last = tn;
    const SV = document.querySelector('#section-view.on'), el = SV && SV.querySelector('.mir-title3d .t3');
    if (!el) { if (X && P.length) { P = []; X.clearRect(0, 0, cv.width, cv.height); } t3 = null; return; }
    if (el !== t3) { t3 = el; landT = null; burst = 0; }
    const pic = el.closest('.mir-title3d').parentElement.querySelector('.mir-par img, .mir-par canvas, .mir-par'), w = el.offsetWidth;
    const S = w && pic ? Math.max(1.001, pic.getBoundingClientRect().width * (1544 / 2400) * .96 / w) : 2, sc = parseFloat(el.style.scale) || 1;
    const prog = Math.max(0, Math.min(1, (sc - 1) / (S - 1)));   /* how far the title has grown */
    if (prog > .02 && prog < .9) moving = 1;
    if (prog > .995 && moving && landT == null) landT = tn;
    let g = Math.pow(Math.sin(Math.PI / 2 * prog), 2) * (.88 + .12 * Math.sin(tn * 2 * Math.PI * .8));   /* the glow blooms as it grows, breathing slowly (no flashing) */
    if (landT != null) g = Math.max(0, 1 - (tn - landT) / 1.8) ** 2; if (!moving && landT == null) g = 0;   /* then settles back to the normal title */
    /* star sparkle */
    if (!cv) { cv = document.createElement('canvas'); cv.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:40'; document.body.appendChild(cv); X = cv.getContext('2d'); }
    const dpr = Math.min(2, devicePixelRatio || 1); if (cv.width !== Math.round(innerWidth * dpr)) { cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr); }
    const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, since = landT != null ? tn - landT : 0;
    if (landT != null && !burst) { burst = 1; for (let i = 0; i < 90; i++) { const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 160; P.push({ x: cx + (Math.random() - .5) * r.width * .9, y: cy + (Math.random() - .5) * r.height * .7, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * .5, age: 0, life: 1.2 + Math.random() * 1.6, s: 1 + Math.random() * 2.6, h: Math.random() }); } }
    const rate = landT != null ? 70 * Math.max(0, 1 - since / 1.6) : moving ? 140 * Math.pow(prog, 1.3) : 0;
    for (let n = rate * dt; n > 0; n--) if (Math.random() < n) P.push({ x: r.left - r.width * .08 + Math.random() * r.width * 1.16, y: r.top - r.height * .25 + Math.random() * r.height * 1.5, vx: (Math.random() - .5) * 14, vy: -6 - Math.random() * 14, age: 0, life: .9 + Math.random() * 1.6, s: .8 + Math.random() * 2.2, h: Math.random() });
    if (!P.length && g <= .002 && !cv._dirty) return;
    X.setTransform(dpr, 0, 0, dpr, 0, 0); X.clearRect(0, 0, innerWidth, innerHeight); X.globalCompositeOperation = 'lighter'; cv._dirty = g > .002 || P.length > 0;
    if (g > .002) {   /* the glow is drawn on its own layer behind the stars, so the letters themselves are never redrawn and can't shimmer */
      X.save(); X.translate(cx, cy); X.scale(1, (r.height * 1.4) / (r.width * .62)); const gl = X.createRadialGradient(0, 0, 0, 0, 0, r.width * .62);
      gl.addColorStop(0, `rgba(170,200,255,${(.26 * g).toFixed(3)})`); gl.addColorStop(.55, `rgba(150,185,255,${(.12 * g).toFixed(3)})`); gl.addColorStop(1, 'rgba(150,185,255,0)');
      X.fillStyle = gl; X.beginPath(); X.arc(0, 0, r.width * .62, 0, 7); X.fill(); X.restore(); }
    P = P.filter(q => (q.age += dt) < q.life);
    P.forEach(q => { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .985; q.vy *= .985;
      const a = Math.sin(Math.PI * q.age / q.life) * (.55 + .45 * Math.sin(q.age * 5 + q.h * 9)), col = q.h < .7 ? '210,228,255' : '255,232,190', L = q.s * 4.5;   /* each star twinkles on its own */
      const gr = X.createRadialGradient(q.x, q.y, 0, q.x, q.y, q.s * 2.2); gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`); X.fillStyle = gr; X.beginPath(); X.arc(q.x, q.y, q.s * 2.2, 0, 7); X.fill();
      X.strokeStyle = `rgba(${col},${a * .55})`; X.lineWidth = .7; X.beginPath(); X.moveTo(q.x - L, q.y); X.lineTo(q.x + L, q.y); X.moveTo(q.x, q.y - L); X.lineTo(q.x, q.y + L); X.stroke(); });
  })();
})();
</script>
