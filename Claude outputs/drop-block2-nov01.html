<script>
/* Nov 1 SOUND (desktop only): The Studio's water drop — real water-drop sounds into a pool: big, smaller, tiny, one each time a drop lands
   (0.72 s, 3.10 s, 4.88 s into the loop), and only while you can see it. */
(function () {
  if (innerWidth <= 760) return;
  const HITS = [[.72, 1], [3.10, .5], [4.88, .2]], fired = [0, 0, 0];
  let bus = null, nb = null;
  (function f() { requestAnimationFrame(f);
    const A = window.__snSfx, ctx = A && A.ctx(); if (!ctx || ctx.state !== 'running') return;
    const v = document.querySelector('#section-view.on .st-drop-vid'); if (!v || v.paused || document.hidden) return;
    const r = v.getBoundingClientRect(), seen = (Math.min(innerHeight, r.bottom) - Math.max(0, r.top)) / Math.max(1, r.height), cy = r.top + r.height * .5;
    if (seen < .75 || cy < innerHeight * .15 || cy > innerHeight * .85 || !document.hasFocus()) return;   /* only when you can see it */
    if (!bus) {   /* mostly dry, with a little room */
      bus = ctx.createGain(); bus.gain.value = 1; bus.connect(A.out());
      const n = Math.floor(ctx.sampleRate * 3.2), ir = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); let lp = 0; for (let i = 0; i < n; i++) { lp += (Math.random() * 2 - 1 - lp) * .5; d[i] = lp * Math.pow(1 - i / n, 3); } }
      const cv = ctx.createConvolver(); cv.buffer = ir; const w = ctx.createGain(); w.gain.value = .22; bus.connect(w); w.connect(cv); cv.connect(A.out());
      const m = ctx.sampleRate * 2; nb = ctx.createBuffer(1, m, ctx.sampleRate); const nd = nb.getChannelData(0); for (let i = 0; i < m; i++) nd[i] = Math.random() * 2 - 1;
    }
    const G = (t, peak, rel) => { const g = ctx.createGain(); g.connect(bus); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(peak, t + .002); g.gain.exponentialRampToValueAtTime(.0001, t + .002 + rel); return g; };
    function plop(t, size) {   /* the bubble's rising "plop", the splash, and a soft knock under the big ones */
      const f0 = size === 1 ? 520 : size === .5 ? 950 : 1500, dur = .06 + .12 * size;
      const o = ctx.createOscillator(); o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * (2.1 + size), t + dur); o.connect(G(t, .5 * (.15 + .85 * size), dur + .05)); o.start(t); o.stop(t + dur + .2);
      const s = ctx.createBufferSource(); s.buffer = nb; const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3800; bp.Q.value = .9; s.connect(bp); bp.connect(G(t, .18 * size + .03, .12 + .25 * size)); s.start(t, Math.random()); s.stop(t + .6);
      if (size > .4) { const k = ctx.createOscillator(); k.frequency.setValueAtTime(140, t); k.frequency.exponentialRampToValueAtTime(70, t + .08); k.connect(G(t, .35 * size, .09)); k.start(t); k.stop(t + .2); }
    }
    const tau = v.currentTime, ct = ctx.currentTime, pn = performance.now();
    HITS.forEach(([h, size], i) => { const d = h - tau; if (d > -.25 && d < .5 && pn - fired[i] > 2000) { fired[i] = pn; plop(ct + Math.max(0, d) - .015, size); } });
  })();
})();
</script>
