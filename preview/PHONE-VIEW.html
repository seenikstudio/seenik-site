<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Seenik on a phone</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #1a1a1c; color: #ddd; font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  body { display: grid; justify-items: center; gap: 18px; padding: 24px 0 40px; }
  .bar { display: flex; gap: 10px; }
  .bar button { font: inherit; color: #ddd; background: #2a2a2e; border: 1px solid #444; border-radius: 999px; padding: 9px 18px; cursor: pointer; }
  .bar button.on { background: #fff; color: #000; }
  .phone { position: relative; width: 393px; height: 852px; padding: 14px; border-radius: 62px; background: #0b0b0c; box-shadow: 0 0 0 2px #3a3a3e, 0 0 0 6px #18181a, 0 40px 80px #000; }
  .screen { position: relative; width: 393px; height: 852px; border-radius: 48px; overflow: hidden; background: #000; }
  .island { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; z-index: 2; pointer-events: none; }
  iframe { width: 393px; height: 852px; border: 0; display: block; }
  p { margin: 0; color: #999; }
</style></head>
<body>
  <div class="bar">
    <button type="button" data-src="SPACE-B.html" class="on">Latest (with the new changes)</button>
    <button type="button" data-src="index.html">Old phone version, for comparison</button>
  </div>
  <div class="phone"><div class="screen"><iframe id="ph" src="about:blank" title="Seenik on a phone"></iframe></div></div>
  <p>iPhone size (393 × 852). Scroll inside the phone.</p>
  <script>
    const show = src => document.getElementById('ph').src = src + '?t=' + Date.now();   // always the newest copy, never an old cached one
    show('SPACE-B.html');
    document.querySelectorAll('.bar button').forEach(b => b.onclick = () => { show(b.dataset.src);
      document.querySelectorAll('.bar button').forEach(x => x.classList.toggle('on', x === b)); });
  </script>
</body></html>
